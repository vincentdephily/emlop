[package]
name = "emlop-lib"
version = "0.9.0"
description = "emerge.log parsing utilities"
keywords = ["gentoo", "portage", "emerge"]
categories = ["parsing"]
readme = "README.md"
license = "GPL-3.0-only"
homepage = "https://github.com/vincentdephily/emlop"
repository = "https://github.com/vincentdephily/emlop"
authors = ["Vincent de Phily <moltonel@gmail.com>"]
edition = "2024"
rust-version = "1.88"

[dependencies]
atoi = "3.1.0"
flate2 = {version = "1.0.28", default-features = false, features = ["zlib-rs"]}
libc = { version = "0.2.126", default-features = false }
log = "0.4.11"
memchr = "2.7.4"
regex = { version = "1.10.0", default-features = false, features = ["std", "perf-inline", "perf-literal", "unicode-case"] }
rev_lines = "0.3.0"
serde = { version = "1.0.184", features = ["derive"] }
serde_json = "1.0.89"
snafu = "0.9.2"
time = {version = "~0.3.47", features = ["parsing", "formatting", "local-offset", "macros"]}

[dev-dependencies]
env_logger = { version = "0.11.0", default-features = false, features = ["auto-color"] }

[features]
# Experimental features, may require nightly compiler.
# Currently only benchmarking.
unstable = []
# Expose unittest helpers like `EmergeInfo::mock()`.
test-helpers = []

[[example]]
name = "elog"
doc-scrape-examples = true

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
